# Keel configuration
version: 1
verify:
  gates:
    - name: rust-tests
      command: cargo test --locked
    - name: clippy
      command: cargo clippy --all-targets -- -D warnings
    - name: npm-wrapper
      command: node --test npm/test.mjs
    - name: doctor
      command: cargo run --quiet -- doctor
memory:
  sources: []

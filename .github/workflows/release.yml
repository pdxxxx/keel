name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v2.0.0)
        required: true
        type: string

permissions:
  contents: read
concurrency: release-${{ inputs.tag || github.ref_name }}
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RUSTUP_TOOLCHAIN: stable

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: keel-linux-x86_64, bin: keel}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: keel-linux-aarch64, bin: keel}
          - {os: macos-latest, target: aarch64-apple-darwin, asset: keel-macos-arm64, bin: keel}
          - {os: macos-latest, target: x86_64-apple-darwin, asset: keel-macos-x86_64, bin: keel}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, asset: keel-windows-x86_64.exe, bin: keel.exe}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/check-release.mjs
      - run: rustup target add ${{ matrix.target }} --toolchain stable
      - name: Enable x86_64 execution on Apple Silicon
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          "$binary" doctor
          "$binary" rules check --strict
          mkdir release-assets
          cp "$binary" "release-assets/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error

  github-release:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: keel-*
          path: release-assets
          merge-multiple: true
      - name: Check completeness, generate hashes and upload before npm is visible
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(keel-linux-aarch64 keel-linux-x86_64 keel-macos-arm64 keel-macos-x86_64 keel-windows-x86_64.exe)
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" SHA256SUMS.txt --verify-tag --title "Keel $TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  publish-npm:
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: node .github/check-release.mjs
      - run: node --test npm/test.mjs
      - name: Publish once with npm trusted publishing
        shell: bash
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@pdxxxx%2fkeel/${TAG#v}")
          case "$status" in
            200) echo "Version ${TAG#v} is already published" ;;
            404) npm publish --provenance --access public ;;
            *) echo "Unexpected npm registry status: $status" >&2; exit 1 ;;
          esac

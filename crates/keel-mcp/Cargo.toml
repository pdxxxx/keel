[package]
name = "keel-mcp"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Native stdio MCP server for Keel repository contracts and local memory"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
walkdir = "2"
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
